<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100918"><title>Bowtie Network | Rob Polanco</title><style>
:root{--bg:#0e1012;--panel:#191c20;--panel2:#23272c;--line:#373a40;--gold:#dfb86b;--text:#f5f3ef;--muted:#a7aab0;--good:#82cda8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#111315ed;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.nav{max-width:1160px;margin:auto;min-height:72px;padding:10px 22px;display:flex;align-items:center;gap:16px}.logo{font-size:26px;font-weight:950;letter-spacing:-1.5px;color:var(--gold)}.logo small{display:block;font-size:9px;font-weight:600;letter-spacing:2px;color:#c6c3bd}.navlinks{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}.nav button,.secondary,.tab{border:1px solid transparent;background:transparent;color:#ddd;padding:10px 12px;border-radius:9px}.nav button:hover,.tab:hover{background:#2b2e32}.nav .active{color:var(--gold)}.primary{border:0;background:var(--gold);color:#181716;font-weight:800;padding:12px 17px;border-radius:10px}.secondary{border-color:#666}.wrap{max-width:1160px;margin:auto;padding:28px 22px 90px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;min-height:380px;margin:16px 0 36px}.heroCopy{padding:46px 34px;background:linear-gradient(130deg,#25282c,#111315);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.hero h1{font-size:clamp(38px,5vw,66px);letter-spacing:-3px;line-height:1.04;margin:18px 0}.hero h1 span{color:var(--gold)}.hero p{line-height:1.65;color:#c5c5c5;max-width:530px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.heroArt{border:1px solid #4b4130;border-radius:18px;background:radial-gradient(circle at 55% 37%,#6c5732 0,#29261f 32%,#141618 70%);display:grid;place-items:center;overflow:hidden;min-height:290px}.bow{width:min(320px,75vw);margin:auto;filter:drop-shadow(0 12px 25px #0009);transform:rotate(-7deg)}.bow svg{display:block;width:100%;height:auto}.heroArt .tag{font-size:12px;letter-spacing:4px;text-align:center;color:#e9d4a8}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:30px 0 18px}.sectionHead h2{font-size:29px;letter-spacing:-1px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;border:1px solid #746344;border-radius:100px;color:var(--gold);padding:6px 10px;font-size:11px;font-weight:800}.notice{padding:14px 16px;border:1px solid #6d5a35;background:#30271977;color:#e9d9ba;border-radius:12px;margin:16px 0;line-height:1.5}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.tab{border:1px solid var(--line);padding:10px 14px}.tab.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}.search{background:#1d2024;border:1px solid #494c50;border-radius:10px;padding:12px;color:white;width:100%;max-width:300px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.car{border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden}.carVisual{height:170px;background:linear-gradient(135deg,#41464b,#1b1f23);display:flex;align-items:center;justify-content:center;position:relative}.carVisual svg{width:80%;max-height:140px;opacity:.9}.goldMark{position:absolute;top:12px;left:12px;background:#dcb56b;color:#17120b;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:900}.carBody{padding:16px}.car h3{margin:6px 0 7px;font-size:18px}.carMeta{color:#b6b7b9;font-size:12px;line-height:1.6}.carActions{display:flex;gap:8px;margin-top:15px}.carActions button{flex:1}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat strong{display:block;font-size:30px;margin-top:10px}.stat span{font-size:12px;color:var(--muted)}.stack{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.line{border-top:1px solid var(--line);margin:14px 0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#ccc}.field input,.field select{width:100%;padding:12px;background:#101215;border:1px solid #51545a;border-radius:9px;color:white}.field input:focus{outline:2px solid var(--gold)}.status{font-size:11px;border-radius:20px;padding:6px 9px;background:#31363b;color:#d8d8d8}.status.good{color:#9fe2b9;background:#203d30}.tableWrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #35393d;white-space:nowrap}th{color:#a8a8aa;font-size:11px;text-transform:uppercase;letter-spacing:1px}.hidden{display:none!important}.empty{padding:35px;text-align:center;color:#aaa;border:1px dashed #555;border-radius:12px}.footer{padding:35px 22px;border-top:1px solid var(--line);color:#999;text-align:center;font-size:12px}.linkBox{background:#0c0e10;border:1px dashed #666;padding:12px;border-radius:10px;overflow-wrap:anywhere;font-size:12px;color:#dfc38e}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.buttonDanger{border:1px solid #a65e5e;background:transparent;color:#f1b3b3;padding:10px 12px;border-radius:8px}.switch{display:flex;gap:8px;align-items:center}.switch input{accent-color:#dcb56b}.hint{font-size:11px;color:#aaa;line-height:1.5}.callout{border-left:3px solid var(--gold);padding:13px 17px;background:#26231d;margin:18px 0}.wide{width:100%}a{color:var(--gold)}@media(max-width:800px){.hero,.two,.adminGrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{align-items:flex-start;flex-direction:column}.navlinks{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}.navlinks button{white-space:nowrap}.heroCopy{padding:30px 23px}.heroArt{min-height:240px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:18px 14px 70px}.hero h1{letter-spacing:-2px}.carVisual{height:195px}.nav{padding:12px 14px}}

/* Rob Polanco signature palette: royal purple, midnight black and gold */
:root{--bg:#0d0814;--panel:#1a1026;--panel2:#29193a;--line:#4c3562;--gold:#e6bc65;--text:#f9f5ff;--muted:#bbaeca;--good:#82cda8}
body{background:radial-gradient(ellipse at 82% 0%,#29133f 0%,#0d0814 52%);background-attachment:fixed}
.top{background:#10091aee;border-bottom-color:#51316b}
.nav button:hover,.tab:hover{background:#352147}
.heroCopy{background:linear-gradient(125deg,#311b4b 0%,#160e23 57%,#0e0a16 100%)}
.heroArt{border-color:#8b672e;background:radial-gradient(circle at 50% 40%,#65358c 0%,#2b1742 35%,#0d0915 74%)}
.carVisual{background:linear-gradient(135deg,#4d3365,#1c1129)}

.field input,.field select,.search{background:#130d1d;border-color:#59406e}
.status{background:#39254b}.linkBox{background:#130c1f;border-color:#75559a}
.callout{background:#281935}.goldMark{background:#e6bc65}

</style></head><body><header class="top"><div class="nav"><div class="logo">BOWTIE.<small>ROB POLANCO</small></div><nav class="navlinks"><button data-page="home" class="active">Home</button><button data-page="inventory">Shop Vehicles</button><button data-page="dashboard">My Network</button><a href="./member.html" style="color:#f4cc7b;padding:10px;text-decoration:none;font-weight:700">Secure Member Login ↗</a><button data-page="admin">Admin Demo</button></nav></div></header><main class="wrap"><div id="view"></div></main><footer class="footer">BOWTIE NETWORK • Independent concept for Rob Polanco • Not an official dealership site or active rewards program.<br>Prototype stores demo data only in this browser. No real accounts, payments, or inventory synchronization.</footer><script>
const KEY='bowtie_demo_v1',BASE=[{id:'demo-f1',year:2026,make:'Subaru',model:'Forester Premium',price:31995,miles:8,stock:'DEMO-F104',vin:'DEMO-VIN-F104',store:'Hicks Family Subaru',type:'new',gold:true},{id:'demo-o1',year:2026,make:'Subaru',model:'Outback Limited',price:35850,miles:12,stock:'DEMO-O217',vin:'DEMO-VIN-O217',store:'Hicks Family Subaru',type:'new',gold:false},{id:'demo-c1',year:2026,make:'Subaru',model:'Crosstrek Sport',price:30490,miles:6,stock:'DEMO-C129',vin:'DEMO-VIN-C129',store:'Hicks Family Subaru',type:'new',gold:true},{id:'demo-u1',year:2024,make:'Toyota',model:'Tacoma SR5',price:33500,miles:21800,stock:'DEMO-U201',vin:'DEMO-VIN-U201',store:'Ed Hicks dealership (sample)',type:'used',gold:true},{id:'demo-u2',year:2023,make:'Honda',model:'CR-V EX',price:26800,miles:32400,stock:'DEMO-U202',vin:'DEMO-VIN-U202',store:'Ed Hicks dealership (sample)',type:'used',gold:false},{id:'demo-u3',year:2024,make:'Subaru',model:'Outback Premium',price:28950,miles:17400,stock:'DEMO-U203',vin:'DEMO-VIN-U203',store:'Hicks Family Subaru',type:'used',gold:false}];
const initial=()=>({vehicles:BASE,members:[{id:'M1001',name:'Alex Sample',email:'alex@example.test',code:'ALEX1001',source:'invited',created:new Date().toISOString()}],referrals:[{id:'R1001',memberId:'M1001',vehicleId:'demo-f1',buyer:'Sample Buyer',status:'Contacted',created:new Date().toISOString()}],current:'M1001',seq:1002});let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}let page='home',filter='all',query='',selectedVehicle=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});const member=()=>state.members.find(x=>x.id===state.current);const car=id=>state.vehicles.find(v=>v.id===id);const memberName=id=>state.members.find(m=>m.id===id)?.name||'Unknown';const token=()=>Math.random().toString(36).slice(2,9).toUpperCase();const vehicleTitle=v=>`${v.year} ${v.make} ${v.model}`;const carSvg=`<svg viewBox="0 0 400 170" aria-hidden="true"><defs><linearGradient id="cg" x1="0" x2="1"><stop stop-color="#9ca2a8"/><stop offset=".5" stop-color="#d4d6d7"/><stop offset="1" stop-color="#7e858b"/></linearGradient></defs><path fill="url(#cg)" d="M48 105 L83 91 L114 54 Q130 43 159 42 L260 42 Q286 44 308 68 L333 92 L361 101 Q371 107 370 122 L370 133 L32 133 L32 118 Q33 109 48 105Z"/><path fill="#242b32" d="M123 59 L157 53 L252 53 Q270 54 285 72 L301 91 L101 91Z"/><path fill="#4e555b" d="M185 55 L191 55 L191 90 L185 90Z"/><circle fill="#111518" cx="106" cy="131" r="25"/><circle fill="#bfc4c7" cx="106" cy="131" r="13"/><circle fill="#111518" cx="304" cy="131" r="25"/><circle fill="#bfc4c7" cx="304" cy="131" r="13"/><path fill="#e9d7a8" d="M353 105h16v10h-17Z"/></svg>`;
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));const badge=v=>v.gold?'<span class="goldMark">◆ GOLD BOWTIE</span>':'';
function verifiedPrice(v){const u=String(v.dealerUrl||'');try{const parsed=new URL(u);return parsed.protocol==='https:' && /(^|\\.)(hicksfamilysubaru\\.com|hicksautogroup\\.com)$/.test(parsed.hostname)}catch{return false}}
function priceAction(v){return verifiedPrice(v)?'<a class="primary" style="display:inline-block;padding:10px 14px;text-decoration:none;border-radius:8px" href="'+esc(v.dealerUrl)+'" target="_blank" rel="noopener noreferrer">View Today’s Price ↗</a>':'<span class="muted small">Today’s price available on the dealership website once linked</span>'}
function verificationStamp(v){return v.lastVerified?'<span class="muted small">Last verified: '+esc(new Date(v.lastVerified).toLocaleString())+'</span>':'<span class="muted small">Not yet verified against dealership website</span>'}
function vehicleCard(v){return `<article class="car"><div class="carVisual">${badge(v)}${carSvg}</div><div class="carBody"><span class="pill">${v.type==='new'?'NEW SUBARU':'PRE-OWNED'}</span><h3>${esc(vehicleTitle(v))}</h3><div>${priceAction(v)}</div><div>${verificationStamp(v)}</div><div class="carMeta">${esc(v.store)}<br>Stock ${esc(v.stock)} · ${Number(v.miles).toLocaleString()} miles</div><div class="carActions"><button class="secondary" onclick="detail('${esc(v.id)}')">Details</button><button class="primary" onclick="refer('${esc(v.id)}')">Share / Refer</button></div></div></article>`}
function home(){return `<section class="hero"><div class="heroCopy"><span class="eyebrow">Welcome to the Bowtie Network</span><h1>Your Car Guy.<br><span>Your Way.</span></h1><p>Shop new Subarus and pre-owned vehicles from participating Coastal Bend dealerships. Discover Gold Bowtie featured picks, connect directly with Rob Polanco, and track your introductions in one place.</p><div class="actions"><button class="primary" onclick="go('inventory')">Explore Vehicles →</button><button class="secondary" onclick="go('dashboard')">Join the Network</button></div></div><div class="heroArt"><div><div class="bow" role="img" aria-label="Gold bow tie"><svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="bowGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0bd"/><stop offset=".42" stop-color="#dba74a"/><stop offset="1" stop-color="#8b5a20"/></linearGradient></defs><path d="M144 65 C112 47 61 19 32 28 Q17 30 18 48 L18 125 Q20 143 39 139 C78 133 112 111 144 104 Z" fill="url(#bowGold)" stroke="#f7d995" stroke-width="3"/><path d="M176 65 C208 47 259 19 288 28 Q303 30 302 48 L302 125 Q300 143 281 139 C242 133 208 111 176 104 Z" fill="url(#bowGold)" stroke="#f7d995" stroke-width="3"/><path d="M33 36 Q81 79 142 85 M287 36 Q239 79 178 85" stroke="#80501c" stroke-width="5" fill="none" opacity=".45"/><rect x="139" y="55" width="42" height="61" rx="13" fill="#f4cf7b" stroke="#ffe9ae" stroke-width="3"/><path d="M150 60 Q143 85 150 111" fill="none" stroke="#a26b27" stroke-width="4" opacity=".55"/></svg></div><div class="tag">THE GOLD BOWTIE COLLECTION</div></div></div></section><div class="notice">Prototype preview: All vehicle records are fictional examples. Live inventory, lead delivery, authentication, and gift-card redemption are not connected.</div><div class="sectionHead"><h2>Gold Bowtie Featured</h2><button class="secondary" onclick="filter='gold';go('inventory')">See Collection →</button></div><div class="grid">${state.vehicles.filter(v=>v.gold).slice(0,3).map(vehicleCard).join('')||'<div class="empty">No featured vehicles yet.</div>'}</div><div class="sectionHead"><h2>One Network. More Choices.</h2></div><div class="two"><div class="card"><span class="eyebrow">New Inventory</span><h2>Subaru, exclusively.</h2><p class="muted">New vehicles from Hicks Family Subaru only.</p><button class="secondary" onclick="filter='new';go('inventory')">Shop New Subaru</button></div><div class="card"><span class="eyebrow">Pre-Owned Inventory</span><h2>Across the Coastal Bend.</h2><p class="muted">Pre-owned vehicles from participating Hicks / Ed Hicks stores.</p><button class="secondary" onclick="filter='used';go('inventory')">Shop Pre-Owned</button></div></div>`}
function inventory(){const filtered=state.vehicles.filter(v=>(filter==='all'||filter==='gold'&&v.gold||filter===v.type)&&(!query||[vehicleTitle(v),v.store,v.stock].join(' ').toLowerCase().includes(query.toLowerCase())));return `<div class="sectionHead"><div><span class="eyebrow">Shop with Bowtie</span><h2>Find Your Next Ride</h2></div><span class="muted small">${filtered.length} vehicles in this preview</span></div><div class="filters">${[['all','All Vehicles'],['new','New Subaru'],['used','Pre-Owned'],['gold','◆ Gold Bowtie']].map(([k,l])=>`<button class="tab ${filter===k?'active':''}" onclick="filter='${k}';render()">${l}</button>`).join('')}<input class="search" placeholder="Search make, model, stock..." value="${esc(query)}" oninput="query=this.value;renderSearch()" id="search"></div><div id="carResults" class="grid">${filtered.map(vehicleCard).join('')||'<div class="empty">No matching vehicles.</div>'}</div>`}
function renderSearch(){const focus=document.activeElement;const pos=focus?.selectionStart;const el=document.getElementById('carResults');if(!el)return;const filtered=state.vehicles.filter(v=>(filter==='all'||filter==='gold'&&v.gold||filter===v.type)&&[vehicleTitle(v),v.store,v.stock].join(' ').toLowerCase().includes(query.toLowerCase()));el.innerHTML=filtered.map(vehicleCard).join('')||'<div class="empty">No matching vehicles.</div>'}
function detail(id){selectedVehicle=id;const v=car(id);if(!v)return;document.getElementById('view').innerHTML=`<button class="secondary" onclick="go('inventory')">← Back to inventory</button><div class="hero"><div class="heroArt">${carSvg}</div><div class="heroCopy"><span class="eyebrow">${v.gold?'◆ GOLD BOWTIE FEATURED':v.type==='new'?'NEW SUBARU':'PRE-OWNED'}</span><h1 style="font-size:38px">${esc(vehicleTitle(v))}</h1><div>${priceAction(v)}</div><p>${verificationStamp(v)}</p><p>${esc(v.store)}<br>Stock: ${esc(v.stock)}<br>VIN: ${esc(v.vin)}<br>Mileage: ${Number(v.miles).toLocaleString()}</p><div class="actions"><button class="primary" onclick="refer('${esc(v.id)}')">Share / Refer</button><button class="secondary" onclick="go('dashboard')">My Network</button></div></div></div><div class="notice">This is a sample vehicle record, not a live offer or availability confirmation. Photos are placeholders.</div>`}
function referralUrl(v,m){return `${location.origin}${location.pathname}#ref=${encodeURIComponent(m.code)}&vehicle=${encodeURIComponent(v.id)}`};function refer(id){const v=car(id),m=member();if(!m){selectedVehicle=id;go('dashboard');return}const url=referralUrl(v,m);document.getElementById('view').innerHTML=`<button class="secondary" onclick="go('inventory')">← Inventory</button><div class="sectionHead"><h2>Share This Vehicle</h2></div><div class="card" style="max-width:650px"><span class="pill">${v.gold?'◆ GOLD BOWTIE':'BOWTIE NETWORK'}</span><h2>${esc(vehicleTitle(v))}</h2><p class="muted">Your unique link identifies your member account and this vehicle. A completed buyer inquiry is required for referral tracking.</p><div class="linkBox" id="shareUrl">${esc(url)}</div><div class="actions"><button class="primary" onclick="copyText(${JSON.stringify(url).replace(/"/g,'&quot;')})">Copy Personal Link</button><button class="secondary" onclick="go('dashboard')">My Dashboard</button></div><div class="notice">In this prototype, links only demonstrate attribution. They are not connected to a server, and no real buyer data should be entered.</div></div>`}
function dashboard(){const m=member(),mine=state.referrals.filter(r=>r.memberId===m?.id);return `<div class="sectionHead"><div><span class="eyebrow">The Bowtie Network</span><h2>My Dashboard</h2></div><span class="pill">${m?'MEMBER '+esc(m.id):'GUEST'}</span></div>${!m?registration():`<p class="muted">Welcome back, ${esc(m.name)}.</p><div class="statgrid"><div class="card stat"><span>Referrals Recorded</span><strong>${mine.length}</strong></div><div class="card stat"><span>Active Referrals</span><strong>${mine.filter(r=>!['Delivered','Closed'].includes(r.status)).length}</strong></div><div class="card stat"><span>Completed Sales</span><strong>${mine.filter(r=>r.status==='Delivered').length}</strong></div><div class="card stat"><span>Available Points</span><strong>0</strong></div></div><div class="notice">Rewards are disabled. Proposed future policy: 1 point = $1 redemption value, only if approved. No points have been awarded, and no payment or gift-card entitlement is created by this prototype.</div><div class="two"><div class="card"><h3>My Personal Link</h3><p class="muted small">Your general network link</p><div class="linkBox">${esc(location.origin+location.pathname+'#ref='+m.code)}</div><div class="actions"><button class="primary" onclick="copyText(${JSON.stringify(location.origin+location.pathname+'#ref='+m.code).replace(/"/g,'&quot;')})">Copy Link</button><button class="secondary" onclick="go('inventory')">Choose Vehicle</button></div></div><div class="card"><h3>Account</h3><p>${esc(m.name)}<br><span class="muted">${esc(m.email)}</span></p><p class="small muted">Member code: ${esc(m.code)}<br>Joined via ${esc(m.source)}</p><button class="secondary" onclick="state.current=null;save();render()">Switch / Sign Out Demo</button></div></div><div class="sectionHead"><h2>Referral Activity</h2></div><div class="card tableWrap"><table><thead><tr><th>Reference</th><th>Vehicle</th><th>Status</th><th>Date</th></tr></thead><tbody>${mine.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(vehicleTitle(car(r.vehicleId)||{year:'',make:'Vehicle',model:'unavailable'}))}</td><td><span class="status ${r.status==='Delivered'?'good':''}">${esc(r.status)}</span></td><td>${new Date(r.created).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="4">No referrals yet.</td></tr>'}</tbody></table></div>`}`}
function registration(){return `<div class="two"><div class="card"><h3>Join the Bowtie Network</h3><p class="muted small">Public self-registration or invitation code. Demo only: this does not create a secure online account.</p><form onsubmit="signup(event)"><div class="field"><label>Your name</label><input name="name" required maxlength="80"></div><div class="field"><label>Email</label><input name="email" type="email" required maxlength="120"></div><div class="field"><label>Invitation code (optional)</label><input name="invite" id="invite" maxlength="30"></div><button class="primary wide">Create Demo Profile</button></form></div><div class="card"><h3>Returning Demo Member</h3><p class="muted small">Choose a locally stored demo profile. Production will require verified sign-in.</p><div class="field"><label>Member</label><select id="memberChoice">${state.members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)} (${esc(m.id)})</option>`).join('')}</select></div><button class="secondary wide" onclick="state.current=document.getElementById('memberChoice').value;save();render()">Open Demo Dashboard</button></div></div>`}
function signup(e){e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),email=String(f.get('email')).trim().toLowerCase(),invite=String(f.get('invite')).trim();if(!name||!email)return;const existing=state.members.find(m=>m.email===email);if(existing){state.current=existing.id;save();render();return}const id='M'+state.seq++,m={id,name,email,code:'BT'+token(),source:invite?'invited':'public',created:new Date().toISOString()};state.members.push(m);state.current=id;save();render()}
function admin(){return `<div class="sectionHead"><div><span class="eyebrow">Private Admin • Prototype</span><h2>Bowtie Control Center</h2></div><span class="pill">DEMO ONLY</span></div><div class="notice">This demo admin screen is NOT access-controlled. Do not publish it as a real admin portal. A production version needs server-side authentication, permissions, encrypted data, and audit logs.</div><div class="statgrid"><div class="card stat"><span>Vehicles</span><strong>${state.vehicles.length}</strong></div><div class="card stat"><span>Gold Bowtie</span><strong>${state.vehicles.filter(v=>v.gold).length}</strong></div><div class="card stat"><span>Members</span><strong>${state.members.length}</strong></div><div class="card stat"><span>Referrals</span><strong>${state.referrals.length}</strong></div></div><div class="sectionHead"><h2>Inventory Management</h2></div><div class="two"><div class="card"><h3>Import Inventory CSV</h3><p class="hint">Columns: year,make,model,price,miles,stock,vin,store,type,gold. Type must be new or used. Only new Subaru at Hicks Family Subaru is accepted; pre-owned can come from participating stores. Import replaces the sample catalog.</p><input type="file" accept=".csv,text/csv" id="csvfile"><div class="actions"><button class="primary" onclick="importCSV()">Import CSV</button><button class="secondary" onclick="downloadTemplate()">CSV Template</button></div><p class="hint">CSV parsing supports standard quoted values. Verify permission to use the source inventory feed.</p></div><div class="card"><h3>Add / Update Vehicle</h3><form onsubmit="addVehicle(event)"><div class="two"><div class="field"><label>Year</label><input name="year" type="number" min="1990" max="2035" required value="2026"></div><div class="field"><label>Make</label><input name="make" required value="Subaru"></div></div><div class="field"><label>Model and trim</label><input name="model" required placeholder="Forester Premium"></div><div class="two"><div class="field"><label>Price</label><input name="price" type="number" min="0" required></div><div class="field"><label>Miles</label><input name="miles" type="number" min="0" required value="0"></div></div><div class="two"><div class="field"><label>Stock number</label><input name="stock" required></div><div class="field"><label>VIN</label><input name="vin" required></div></div><div class="field"><label>Dealership</label><input name="store" required value="Hicks Family Subaru"></div><div class="field"><label>Inventory type</label><select name="type"><option value="new">New Subaru</option><option value="used">Pre-Owned</option></select></div><label class="switch"><input type="checkbox" name="gold"> Gold Bowtie featured</label><br><button class="primary wide">Save Vehicle</button></form></div></div><div class="card tableWrap" style="margin-top:18px"><table><thead><tr><th>Stock</th><th>Vehicle</th><th>Store</th><th>Gold</th><th>Action</th></tr></thead><tbody>${state.vehicles.map(v=>`<tr><td>${esc(v.stock)}</td><td>${esc(vehicleTitle(v))}</td><td>${esc(v.store)}</td><td><input type="checkbox" ${v.gold?'checked':''} onchange="toggleGold('${esc(v.id)}',this.checked)" aria-label="Gold Bowtie for ${esc(v.stock)}"></td><td><button class="buttonDanger" onclick="removeVehicle('${esc(v.id)}')">Remove</button></td></tr>`).join('')}</tbody></table></div><div class="sectionHead"><h2>Referral Pipeline</h2></div><div class="card tableWrap"><table><thead><tr><th>Referral</th><th>Member</th><th>Vehicle</th><th>Status</th></tr></thead><tbody>${state.referrals.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(memberName(r.memberId))}</td><td>${esc(car(r.vehicleId)?.stock||'Unavailable')}</td><td><select onchange="changeStatus('${esc(r.id)}',this.value)">${['Submitted','Contacted','Appointment','Delivered','Closed'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="adminGrid" style="margin-top:18px"><div class="card"><h3>Record a Demo Referral</h3><form onsubmit="recordReferral(event)"><div class="field"><label>Member</label><select name="memberId">${state.members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Vehicle</label><select name="vehicleId">${state.vehicles.map(v=>`<option value="${esc(v.id)}">${esc(v.stock)} — ${esc(vehicleTitle(v))}</option>`).join('')}</select></div><div class="field"><label>Buyer reference (fictional only)</label><input name="buyer" required placeholder="Sample buyer"></div><button class="primary wide">Record Demo Referral</button></form></div><div class="card"><h3>Member Invitations</h3><p class="muted small">Create a reusable demo invitation URL. Real invitations will use expiring single-use server tokens.</p><button class="primary" onclick="makeInvite()">Generate Invitation</button><div id="inviteResult" class="linkBox" style="margin-top:12px">No invitation generated.</div><div class="line"></div><h3>Reward & Check Register</h3><span class="status">LOCKED • COMPLIANCE REVIEW</span><p class="hint">1 point = $1 proposed redemption value. No points can be awarded, redeemed, or converted to checks or gift cards in this version.</p></div></div><div class="sectionHead"><h2>Demo Tools</h2></div><button class="buttonDanger" onclick="if(confirm('Reset all browser demo data?')){state=initial();save();go('home')}">Reset Prototype Data</button>`}
function toggleGold(id,val){const v=car(id);if(v){v.gold=val;save();render()}}function removeVehicle(id){if(!confirm('Remove this sample vehicle?'))return;state.vehicles=state.vehicles.filter(v=>v.id!==id);save();render()}function changeStatus(id,val){const r=state.referrals.find(r=>r.id===id);if(r){r.status=val;save()}}function recordReferral(e){e.preventDefault();const f=new FormData(e.target);state.referrals.push({id:'R'+state.seq++,memberId:f.get('memberId'),vehicleId:f.get('vehicleId'),buyer:String(f.get('buyer')).slice(0,80),status:'Submitted',created:new Date().toISOString()});save();render()}function addVehicle(e){e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries());v.year=Number(v.year);v.price=Number(v.price);v.miles=Number(v.miles);v.gold=f.has('gold');v.type=String(v.type).toLowerCase();if(v.type==='new'&&(v.make.toLowerCase()!=='subaru'||v.store.trim().toLowerCase()!=='hicks family subaru'))return alert('New inventory is restricted to Hicks Family Subaru Subarus.');const old=state.vehicles.find(x=>x.stock.toLowerCase()===v.stock.toLowerCase());v.id=old?.id||'manual-'+token();if(old)Object.assign(old,v);else state.vehicles.push(v);save();render()}
function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}function importCSV(){const file=document.getElementById('csvfile').files[0];if(!file)return alert('Choose a CSV file.');file.text().then(t=>{const rows=parseCSV(t);if(rows.length<2)return alert('CSV has no data rows.');const headers=rows.shift().map(s=>s.trim().toLowerCase());const req=['year','make','model','price','miles','stock','vin','store','type','gold'];if(req.some(h=>!headers.includes(h)))return alert('Missing required columns: '+req.filter(h=>!headers.includes(h)).join(', '));const result=[];for(const row of rows){const o=Object.fromEntries(headers.map((h,i)=>[h,(row[i]||'').trim()]));if(!o.stock||!o.vin||!o.model)continue;o.type=o.type.toLowerCase();if(!['new','used'].includes(o.type))continue;if(o.type==='new'&&(o.make.toLowerCase()!=='subaru'||o.store.toLowerCase()!=='hicks family subaru'))continue;result.push({id:'csv-'+o.stock,year:Number(o.year),make:o.make,model:o.model,price:Number(o.price),miles:Number(o.miles),stock:o.stock,vin:o.vin,store:o.store,type:o.type,gold:['yes','true','1','y'].includes(o.gold.toLowerCase())})}if(!result.length)return alert('No valid inventory rows.');if(!confirm('Replace current demo inventory with '+result.length+' imported vehicles?'))return;state.vehicles=result;save();render();alert('Imported '+result.length+' vehicles into this browser demo.')}).catch(()=>alert('Could not read CSV.'))}function downloadTemplate(){const content='year,make,model,price,miles,stock,vin,store,type,gold\n2026,Subaru,Forester Premium,31995,8,DEMO-F104,DEMO-VIN-F104,Hicks Family Subaru,new,yes\n2023,Toyota,Tacoma SR5,30000,20000,DEMO-U001,DEMO-VIN-U001,Participating Ed Hicks store,used,no\n';const blob=new Blob([content],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bowtie-inventory-template.csv';a.click();URL.revokeObjectURL(a.href)}function makeInvite(){const url=location.origin+location.pathname+'#invite=INV-'+token();document.getElementById('inviteResult').textContent=url;copyText(url)}function copyText(s){navigator.clipboard?.writeText(s).then(()=>alert('Copied!')).catch(()=>prompt('Copy this link:',s))||prompt('Copy this link:',s)}
function render(){document.getElementById('view').innerHTML=page==='home'?home():page==='inventory'?inventory():page==='dashboard'?dashboard():admin()};render();if(location.hash.includes('invite=')){const val=decodeURIComponent(location.hash.split('invite=')[1].split('&')[0]);go('dashboard');if(!member()){const x=document.getElementById('invite');if(x)x.value=val}}if(location.hash.includes('ref=')){const params=new URLSearchParams(location.hash.slice(1)),ref=params.get('ref'),vid=params.get('vehicle');const m=state.members.find(x=>x.code===ref);if(!m && ref){document.getElementById('view').insertAdjacentHTML('afterbegin',`<div class="callout"><strong>Welcome to Bowtie Network!</strong><br>Your member invitation link is recognized. <a href="./inquiry.html#ref=${encodeURIComponent(ref)}${vid?'&vehicle='+encodeURIComponent(vid):''}">Submit a vehicle inquiry</a> (verified account required).</div>`)}if(m){const v=car(vid);document.getElementById('view').insertAdjacentHTML('afterbegin',`<div class="callout"><strong>Shared by ${esc(m.name)}</strong><br>${v?'Featured vehicle: '+esc(vehicleTitle(v)):'Explore Bowtie vehicles below.'}<br><span class="hint">Referral source recognized in demo. Buyer inquiry capture requires a production backend.</span></div>`);if(v){filter='all';go('inventory');document.getElementById('view').insertAdjacentHTML('afterbegin',`<div class="callout">Shared by ${esc(m.name)} · ${esc(vehicleTitle(v))} · Attribution preview only</div>`)}}}
</script></body></html>
