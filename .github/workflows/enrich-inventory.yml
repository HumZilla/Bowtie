name: Enrich Bowtie vehicle details
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Match public listings by VIN and update details
        run: python scripts/enrich_inventory.py
      - name: Commit enrichment without replacing inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory-public.json inventory-other-stores.json
          git diff --cached --quiet || (git commit -m "Enrich Bowtie inventory from dealer listings" && git push)
