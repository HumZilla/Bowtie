name: Refresh other stores used inventory
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public inventory pages
        run: python scripts/refresh_other_stores.py
      - name: Commit refreshed inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory-other-stores.json
          git diff --cached --quiet || (git commit -m "Refresh participating dealers used inventory" && git push)
